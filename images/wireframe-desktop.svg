<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#ffffff" stroke="#ddd"/>
  <rect x="40" y="20" width="1120" height="80" fill="#f3f3f3" stroke="#ccc"/>
  <text x="60" y="70" font-family="Arial" font-size="28" fill="#333">Header / Navigation (logo · nav · cart)</text>

  <rect x="40" y="120" width="1120" height="220" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="60" y="180" font-family="Arial" font-size="26" fill="#666">Hero / Intro (headline · CTA)</text>

  <rect x="40" y="360" width="820" height="360" fill="#fff" stroke="#e6e6e6"/>
  <text x="60" y="400" font-family="Arial" font-size="20" fill="#666">Product grid / content area (cards)</text>

  <rect x="880" y="360" width="280" height="200" fill="#fff" stroke="#e6e6e6"/>
  <text x="900" y="400" font-family="Arial" font-size="18" fill="#666">Sidebar / cart preview</text>

  <rect x="40" y="740" width="1120" height="40" fill="#f3f3f3" stroke="#ccc"/>
  <text x="60" y="768" font-family="Arial" font-size="16" fill="#666">Footer (contact · links)</text>

  <!-- Example product card boxes -->
  <g fill="#f7f7f7" stroke="#ddd">
    <rect x="80" y="420" width="220" height="160"/>
    <rect x="320" y="420" width="220" height="160"/>
    <rect x="560" y="420" width="220" height="160"/>
  </g>
  <text x="100" y="470" font-family="Arial" font-size="14" fill="#999">Product image</text>
</svg>
